# collect-ai 业务字段映射配置
#
# 用途: 业务实体 (products / suppliers / ...) 在不同数据源 (erp / hbpos) 下的字段映射
# 加载: main.go 启动时通过 business.NewRegistryFromYAML() 加载
# 兜底: 加载失败 → 业务层 fallback 到 NewDefaultRegistry() 硬编码
#
# 格式:
#   entities.<entity>:
#     name:        业务实体名 (同 key,可省)
#     description: 业务说明
#     fields.<biz_field>:
#       type:        dimension | measure | time
#       description: 字段说明
#       required:    是否必填 (默认 false)
#     sources.<datasource>:
#       cube:        物理 cube 名
#       fields.<biz_field>: <physical_ref>     # 业务字段 → 物理 cube 字段引用
#       # 留空 "" = 该 ds 不支持该字段(查询时跳过)
#
# 加新 datasource 步骤:
#   1. cube-agent-server 上建 cube (e.g. kingdee_products)
#   2. 本文件 sources 下加 kingdee: { cube: kingdee_products, fields: {...} }
#   3. 重启或热加载,无需改 Go 代码
#
# 物理 cube 字段引用格式:
#   "products.barcode"      (dimension 引用,带 cube 别名前缀)
#   "products.qty"          (measure 引用,带 cube 别名前缀)
#   ""                      (该 ds 不支持,返回空)
#
# 2026-09-02 配置化(原 hardcode 在 internal/business/mapping.go,保留作 fallback)

entities:
  products:
    name: products
    description: 商品主表(跨数据源业务统一)
    fields:
      barcode:
        type: dimension
        description: 商品条码
      product_name:
        type: dimension
        description: 商品名称
      supplier_id:
        type: dimension
        description: 主供应商 ID
      supplier_name:
        type: dimension
        description: 主供应商名
      category:
        type: dimension
        description: 商品分类
      brand:
        type: dimension
        description: 品牌
      stock_qty:
        type: measure
        description: 库存数(已聚合)
      price:
        type: measure
        description: 当前售价(已聚合)
      # 2026-09-02: restock 收编,LoadItemDict 从 products 拿
      clsno:
        type: dimension
        description: 商品分类编码 (HBPoS item_clsno,给 H5 任务列表用)
      clsname:
        type: dimension
        description: 商品分类名 (HBPoS item_clsname,给 H5 任务列表用)
      unit:
        type: dimension
        description: 计量单位 (HBPoS unit_no,给 H5 任务列表用)
    sources:
      erp:
        cube: products
        fields:
          barcode: products.barcode
          product_name: products.name
          supplier_id: products.main_supp_id
          supplier_name: products.main_supp_name
          category: ""        # ERP 没分类字段
          brand: ""           # ERP 没品牌字段
          stock_qty: products.qty
          price: ""           # ERP 当前没暴露售价字段
          clsno: ""           # ERP 未实现
          clsname: ""
          unit: ""
      hbpos:
        cube: t_bd_item_info
        fields:
          barcode: t_bd_item_info.item_no  # HBPoS 无独立条码字段,用 item_no 兜底
          product_name: t_bd_item_info.item_name
          supplier_id: t_bd_item_info.main_supcust
          supplier_name: t_bd_item_info.supplier_name  # cube SQL 已 LEFT JOIN
          category: t_bd_item_info.item_clsno         # 简化:取 clsno
          brand: t_bd_item_info.item_brandname
          # 2026-09-01: cube 加了 stock_qty measure (Scalar Subquery SUM t_im_branch_stock)
          stock_qty: t_bd_item_info.stock_qty
          # 2026-08-31: 售价用 sale_price (原 price 是进价)
          price: t_bd_item_info.sale_price
          # 2026-09-02: restock LoadItemDict 用
          clsno: t_bd_item_info.item_clsno
          clsname: t_bd_item_info.item_clsname
          unit: t_bd_item_info.unit_no

  suppliers:
    name: suppliers
    description: 供应商主表(跨数据源业务统一)
    fields:
      supplier_id:
        type: dimension
        description: 供应商 ID
      supplier_name:
        type: dimension
        description: 供应商名
      contact:
        type: dimension
        description: 联系人
      phone:
        type: dimension
        description: 联系电话
    sources:
      erp:
        # ERP 没独立 supplier 表,从 products cube DISTINCT
        cube: products
        fields:
          supplier_id: products.main_supp_id
          supplier_name: products.main_supp_name
          contact: ""   # ERP 无
          phone: ""     # ERP 无
      hbpos:
        # HBPoS 有独立 suppliers cube
        cube: suppliers
        fields:
          supplier_id: suppliers.supcust_no
          supplier_name: suppliers.sup_name
          contact: suppliers.sup_man
          phone: suppliers.sup_tel

  # 2026-09-04 W4.4: 退货单(规则 8 pending_return 依赖)
  # 物理表: hbpos t_pm_sheet_master WHERE trans_no='RO' AND sale_way='A' (供应商退货单)
  # cube: cube-agent-server/plugins/supplier_returns/plugin.yaml (3484 行 / 2026-09-03 实测)
  # 业务字段名严格隔离, 物理字段名只在本段 + mapping.go registerReturns() 出现 (AGENTS.md §12.3)
  returns:
    name: returns
    description: 供应商退货单主表(W4.4 跨数据源业务统一)
    fields:
      bill_no:
        type: dimension
        description: 退货单号
      supplier_id:
        type: dimension
        description: 供应商编号
      supplier_name:
        type: dimension
        description: 供应商名
      status:
        type: dimension
        description: 状态 (pending=未审核 / approved=已审核 / rejected=永不命中, HBPoS 无此状态)
        # W4.4: ValueMap 翻译层, 业务值 → 物理值 (HBPoS approve_flag)
        #   pending  → "0" (未审核)
        #   approved → "1" (已审核)
        #   rejected → 不在 HBPoS, 不写 (查 cube 会返 0 行)
        value_map:
          pending: "0"
          approved: "1"
      return_money:
        type: measure
        description: 单据金额
      create_date:
        type: time
        description: 制单时间 (cube SQL 自带近 1 年过滤)
      branch_no:
        type: dimension
        description: 门店编号
    sources:
      hbpos:
        # cube SQL 已在 plugin.yaml 端 LEFT JOIN t_bd_supcust_info (cube 端数据治理层职责)
        cube: supplier_returns
        fields:
          bill_no:       supplier_returns.sheet_no
          supplier_id:   supplier_returns.supcust_no
          supplier_name: supplier_returns.sup_name
          status:        supplier_returns.approve_flag
          return_money:  supplier_returns.sheet_amt
          create_date:   supplier_returns.oper_date
          branch_no:     supplier_returns.branch_no
      # 未来加 erp 源: 暂未实现, 等业务需要再补

  # ============================================================
  # freshcheck 生鲜免日盘管理 (W1.3, 2026-09-09)
  # 配套: cube-agent-server feat/freshcheck-cube 分支的 2 个 plugin
  #   - sales_with_refund  (含退货标记 + 原单号, 给 Step 2 退货回冲用)
  #   - items_with_clsno   (含生鲜子类派生, 给建账筛 SKU 用)
  # ============================================================

  # ----- sales_with_refund: 销售流水全集(含退货) -----
  sales_with_refund:
    name: sales_with_refund
    description: 销售流水全集(含退货标记 + 原单号, 给 freshcheck 周期结算的退货回冲算法用)
    fields:
      row_id:
        type: dimension
        description: 伪 PK (ROW_NUMBER 派生, 实际查询用 cube 直接按 time filter)
      oper_date:
        type: time
        description: 销售时间 (oper_date, support dateRange + granularity)
      branch_no:
        type: dimension
        description: 门店编号
      item_no:
        type: dimension
        description: 商品货号
      item_name:
        type: dimension
        description: 商品名
      item_clsno:
        type: dimension
        description: 商品分类编码
      item_clsname:
        type: dimension
        description: 商品分类名
      item_brand:
        type: dimension
        description: 品牌
      main_supcust:
        type: dimension
        description: 主供应商
      sell_way:
        type: dimension
        description: 思迅 sell_way 原值 (A=正/B=退, 需 introspect 确认)
      is_refund:
        type: dimension
        description: 是否退货 (0/1, 业务层翻译)
      voucher_no:
        type: dimension
        description: 原单号 (退单关联正单, 跨期回冲靠这个)
      origin_flow_id:
        type: dimension
        description: 退单原 flow_id (若 t_rm_saleflow 有此字段)
      sale_qnty:
        type: measure
        description: 销量 (退货为负, sum 自动抵消)
      sale_money:
        type: measure
        description: 销售额
      total_cost:
        type: measure
        description: 成本 (in_price * sale_qnty)
      gross_profit:
        type: measure
        description: 毛利 (sale_money - total_cost)
      refund_qnty:
        type: measure
        description: 退货总量 (绝对值, 校验用)
      refund_amt:
        type: measure
        description: 退货总额 (绝对值)
    sources:
      hbpos:
        # cube: cube-agent-server/feat/freshcheck-cube (commit b9a06fa)
        cube: sales_with_refund
        fields:
          row_id:        sales_with_refund.row_id
          oper_date:     sales_with_refund.oper_date
          branch_no:     sales_with_refund.branch_no
          item_no:       sales_with_refund.item_no
          item_name:     sales_with_refund.item_name
          item_clsno:    sales_with_refund.item_clsno
          item_clsname:  sales_with_refund.item_clsname
          item_brand:    sales_with_refund.item_brand
          main_supcust:  sales_with_refund.main_supcust
          sell_way:      sales_with_refund.sell_way
          is_refund:     sales_with_refund.is_refund
          voucher_no:    sales_with_refund.voucher_no
          origin_flow_id: sales_with_refund.origin_flow_id
          sale_qnty:     sales_with_refund.sale_qnty
          sale_money:    sales_with_refund.sale_money
          total_cost:    sales_with_refund.total_cost
          gross_profit:  sales_with_refund.gross_profit
          refund_qnty:   sales_with_refund.refund_qnty
          refund_amt:    sales_with_refund.refund_amt
      # 未来加 erp 源: 暂未实现, 等业务需要再补

  # ----- items_with_clsno: 商品主表 + 生鲜子类派生 -----
  items_with_clsno:
    name: items_with_clsno
    description: 商品主表(11W 行全集) + 生鲜子类派生(fresh_category) + 快/慢周转(turnover_class) + 库存聚合(stock_qty)
    fields:
      item_no:
        type: dimension
        description: 商品货号 (PK)
      item_name:
        type: dimension
        description: 商品名
      item_clsno:
        type: dimension
        description: 商品分类编码
      item_clsname:
        type: dimension
        description: 商品分类名
      item_brand:
        type: dimension
        description: 品牌
      item_brandname:
        type: dimension
        description: 品牌名
      main_supcust:
        type: dimension
        description: 主供应商
      unit:
        type: dimension
        description: 计量单位
      fresh_category:
        type: dimension
        description: 生鲜子类 (leaf/root/aquatic/meat/frozen, NULL=非生鲜)
        # 业务枚举值
        value_map:
          leaf: 'leaf'
          root: 'root'
          aquatic: 'aquatic'
          meat: 'meat'
          frozen: 'frozen'
      turnover_class:
        type: dimension
        description: 快/慢周转 (fast/slow, 决定损耗模型)
      stock_qty:
        type: measure
        description: 库存总量 (Scalar Subquery SUM, 跟 t_bd_item_info 复用)
    sources:
      hbpos:
        cube: items_with_clsno
        fields:
          item_no:         items_with_clsno.item_no
          item_name:       items_with_clsno.item_name
          item_clsno:      items_with_clsno.item_clsno
          item_clsname:    items_with_clsno.item_clsname
          item_brand:      items_with_clsno.item_brand
          item_brandname:  items_with_clsno.item_brandname
          main_supcust:    items_with_clsno.main_supcust
          unit:            items_with_clsno.unit
          fresh_category:  items_with_clsno.fresh_category
          turnover_class:  items_with_clsno.turnover_class
          stock_qty:       items_with_clsno.stock_qty
      # 未来加 erp 源: 暂未实现, 等业务需要再补
