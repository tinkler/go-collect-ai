# collect-ai 业务字段映射配置
#
# 用途: 业务实体 (products / suppliers / ...) 在不同数据源 (erp / hbpos) 下的字段映射
# 加载: main.go 启动时通过 business.NewRegistryFromYAML() 加载
# 兜底: 加载失败 → 业务层 fallback 到 NewDefaultRegistry() 硬编码
#
# 格式:
#   entities.<entity>:
#     name:        业务实体名 (同 key,可省)
#     description: 业务说明
#     fields.<biz_field>:
#       type:        dimension | measure | time
#       description: 字段说明
#       required:    是否必填 (默认 false)
#     sources.<datasource>:
#       cube:        物理 cube 名
#       fields.<biz_field>: <physical_ref>     # 业务字段 → 物理 cube 字段引用
#       # 留空 "" = 该 ds 不支持该字段(查询时跳过)
#
# 加新 datasource 步骤:
#   1. cube-agent-server 上建 cube (e.g. kingdee_products)
#   2. 本文件 sources 下加 kingdee: { cube: kingdee_products, fields: {...} }
#   3. 重启或热加载,无需改 Go 代码
#
# 物理 cube 字段引用格式:
#   "products.barcode"      (dimension 引用,带 cube 别名前缀)
#   "products.qty"          (measure 引用,带 cube 别名前缀)
#   ""                      (该 ds 不支持,返回空)
#
# 2026-09-02 配置化(原 hardcode 在 internal/business/mapping.go,保留作 fallback)

entities:
  products:
    name: products
    description: 商品主表(跨数据源业务统一)
    fields:
      barcode:
        type: dimension
        description: 商品条码
      product_name:
        type: dimension
        description: 商品名称
      supplier_id:
        type: dimension
        description: 主供应商 ID
      supplier_name:
        type: dimension
        description: 主供应商名
      category:
        type: dimension
        description: 商品分类
      brand:
        type: dimension
        description: 品牌
      stock_qty:
        type: measure
        description: 库存数(已聚合)
      price:
        type: measure
        description: 当前售价(已聚合)
      # 2026-09-02: restock 收编,LoadItemDict 从 products 拿
      clsno:
        type: dimension
        description: 商品分类编码 (HBPoS item_clsno,给 H5 任务列表用)
      clsname:
        type: dimension
        description: 商品分类名 (HBPoS item_clsname,给 H5 任务列表用)
      unit:
        type: dimension
        description: 计量单位 (HBPoS unit_no,给 H5 任务列表用)
    sources:
      erp:
        cube: products
        fields:
          barcode: products.barcode
          product_name: products.name
          supplier_id: products.main_supp_id
          supplier_name: products.main_supp_name
          category: ""        # ERP 没分类字段
          brand: ""           # ERP 没品牌字段
          stock_qty: products.qty
          price: ""           # ERP 当前没暴露售价字段
          clsno: ""           # ERP 未实现
          clsname: ""
          unit: ""
      hbpos:
        cube: t_bd_item_info
        fields:
          barcode: t_bd_item_info.item_no  # HBPoS 无独立条码字段,用 item_no 兜底
          product_name: t_bd_item_info.item_name
          supplier_id: t_bd_item_info.main_supcust
          supplier_name: t_bd_item_info.supplier_name  # cube SQL 已 LEFT JOIN
          category: t_bd_item_info.item_clsno         # 简化:取 clsno
          brand: t_bd_item_info.item_brandname
          # 2026-09-01: cube 加了 stock_qty measure (Scalar Subquery SUM t_im_branch_stock)
          stock_qty: t_bd_item_info.stock_qty
          # 2026-08-31: 售价用 sale_price (原 price 是进价)
          price: t_bd_item_info.sale_price
          # 2026-09-02: restock LoadItemDict 用
          clsno: t_bd_item_info.item_clsno
          clsname: t_bd_item_info.item_clsname
          unit: t_bd_item_info.unit_no

  suppliers:
    name: suppliers
    description: 供应商主表(跨数据源业务统一)
    fields:
      supplier_id:
        type: dimension
        description: 供应商 ID
      supplier_name:
        type: dimension
        description: 供应商名
      contact:
        type: dimension
        description: 联系人
      phone:
        type: dimension
        description: 联系电话
    sources:
      erp:
        # ERP 没独立 supplier 表,从 products cube DISTINCT
        cube: products
        fields:
          supplier_id: products.main_supp_id
          supplier_name: products.main_supp_name
          contact: ""   # ERP 无
          phone: ""     # ERP 无
      hbpos:
        # HBPoS 有独立 suppliers cube
        cube: suppliers
        fields:
          supplier_id: suppliers.supcust_no
          supplier_name: suppliers.sup_name
          contact: suppliers.sup_man
          phone: suppliers.sup_tel
